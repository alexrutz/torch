<!doctype html><html><head><meta charset="utf-8"><title>fixes</title>
<style>body{background:#1b1a24;color:#e8dcc0;font:12px monospace;margin:0;padding:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.c{background:#0b0e14;border:1px solid #4a4459;padding:5px;text-align:center}
canvas{image-rendering:pixelated;display:block;margin:0 auto 4px;background:#262433}
span{font-size:10px;color:#9c8f75}</style></head><body>
<div id="o"></div><script type="module">
import { buildTileArt, objectCanvas } from '/src/gfx/tileart.js';
import { buildSprites, mobSprite, itemIcon } from '/src/gfx/sprites.js';
import { tileId } from '/src/world/tiles.js';
buildTileArt(); buildSprites();
const o=document.getElementById('o'); const Z=6;
const row=()=>{const r=document.createElement('div');r.className='row';o.appendChild(r);return r;};
function put(r,label,src,w,h){const d=document.createElement('div');d.className='c';
 const c=document.createElement('canvas');c.width=w*Z;c.height=h*Z;
 const x=c.getContext('2d');x.imageSmoothingEnabled=false;
 if(src)x.drawImage(src,0,0,src.width,src.height,src.width*Z,src.height*Z>0?0:0,src.width*Z,src.height*Z);
 if(src)x.clearRect(0,0,c.width,c.height),x.drawImage(src,0,0,src.width,src.height,0,0,src.width*Z,src.height*Z);
 const s=document.createElement('span');s.textContent=label;d.append(c,s);r.appendChild(d);}
let r=row();
for(const n of ['tree_oak','tree_birch','tree_pine','tree_palm','tree_dead','altar','crystal','flowers']){
  const a=objectCanvas(tileId(n)); put(r,n,a&&a.canvas,16,a?a.canvas.height:16);}
r=row();
const bat=mobSprite('bat');
bat.right.forEach((f,i)=>put(r,'bat f'+i,f,12,12));
r=row();
for(const id of ['wood_pick','iron_pick','moon_pick','stone_hoe','mushroom','glowcap','berry','stew','coconut','coal','stone','flint'])
  put(r,id,itemIcon(id),16,16);
document.title='ready';
</script></body></html>
